[package]
name = "worldgen181"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bit-exact port of the Minecraft Beta 1.8.1 simulation: world generation, ticking, entities, the player, saves"
autobins = false

[lib]
name = "worldgen"

[[bin]]
name = "compare181"
path = "src/bin/compare.rs"

[[bin]]
name = "container_compare181"
path = "src/bin/container_compare.rs"

[[bin]]
name = "entity_compare181"
path = "src/bin/entity_compare181.rs"

[dependencies]
flate2 = "1.1.10"

[[bin]]
name = "terrain_compare181"
path = "src/bin/terrain_compare.rs"

[[bin]]
name = "playercore181"
path = "src/bin/playercore.rs"

[[bin]]
name = "creative181"
path = "src/bin/creative.rs"

[[bin]]
name = "playertick181"
path = "src/bin/playertick181.rs"

[[bin]]
name = "playerlist181"
path = "src/bin/playerlist181.rs"

[[bin]]
name = "playercombat181"
path = "src/bin/playercombat181.rs"

[[bin]]
name = "controller181"
path = "src/bin/controller181.rs"

[[bin]]
name = "chesthooks181"
path = "src/bin/chesthooks181.rs"
