[package]
name = "client181"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Minecraft Beta 1.8.1 client: window, menus, renderer, sound and the singleplayer game loop"

[lib]
path = "src/lib.rs"

[dependencies]
cpal = "0.18"
lewton = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.0"
png = "0.18.1"
pollster = "1.0.1"
wgpu = "30.0.1"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
winit = "0.30.13"
worldgen = { package = "worldgen181", path = "../worldgen181" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

